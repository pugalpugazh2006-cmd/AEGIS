version: "3.8"

services:
  # ---------------------------------------
  # Intelligence Backend
  # ---------------------------------------
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://aegis:aegis_password@postgres:5432/aegis_db
      - REDIS_URL=redis://redis:6379/0
      - PROMETHEUS_URL=http://prometheus:9090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["rq", "worker", "-u", "redis://redis:6379/0", "aegis_tasks"]
    environment:
      - DATABASE_URL=postgresql://aegis:aegis_password@postgres:5432/aegis_db
      - REDIS_URL=redis://redis:6379/0
      - PROMETHEUS_URL=http://prometheus:9090
    depends_on:
      redis:
        condition: service_healthy

  # ---------------------------------------
  # SRE Command Center (Frontend)
  # ---------------------------------------
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  # ---------------------------------------
  # Infrastructure
  # ---------------------------------------
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=aegis
      - POSTGRES_PASSWORD=aegis_password
      - POSTGRES_DB=aegis_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infrastructure/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - prometheus

  # ---------------------------------------
  # Demo Services
  # ---------------------------------------
  api-gateway:
    build:
      context: ./demo-services/api-gateway
    ports:
      - "8080:8080"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - order-service

  order-service:
    build:
      context: ./demo-services/order-service
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - db-simulator

  db-simulator:
    build:
      context: ./demo-services/db-simulator
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
